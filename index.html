  <!-- ==================== 網頁視覺樣式 (CSS) ==================== -->
  <style>
    :root {
      color-scheme: dark;
      --bg: #050d1b;
      --panel: #0b1c33;
      --line: rgba(117,202,255,.2);
      --cyan: #55eaff;
      --white: #f4f9ff;
      --muted: #a9bdd2;
      --max: 1160px;
      --line-green: #06C755; /* LINE 官方綠色 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: Inter, "Pretendard", "Noto Sans KR", system-ui, -apple-system, sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      width: min(var(--max), calc(100% - 44px));
      margin-inline: auto;
    }

    /* 導航欄 */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(4,12,25,.92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }

    .nav {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .logo {
      font-weight: 950;
      letter-spacing: .15em;
      font-size: 1.08rem;
    }

    .logo span { color: var(--cyan); }

    /* 按鈕樣式 */
    .btn {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 28px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-weight: 850;
      text-decoration: none;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform .2s, border-color .2s, box-shadow .2s;
    }

    .btn-line {
      color: #ffffff;
      background: var(--line-green);
      box-shadow: 0 0 28px rgba(6, 199, 85, 0.2);
    }

    .btn-line:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 32px rgba(6, 199, 85, 0.4);
    }

    /* 主視覺區域 */
    .hero {
      position: relative;
      overflow: hidden;
      padding: 90px 0;
      background:
        radial-gradient(ellipse at 78% 42%,rgba(0,127,255,.2),transparent 38%),
        linear-gradient(135deg,#061225,#081a31 58%,#04101f);
    }

    .hero:before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(75,169,255,.045) 1px,transparent 1px),
        linear-gradient(90deg,rgba(75,169,255,.045) 1px,transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom,#000,transparent);
    }

    .hero-grid {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 40px;
    }

    @media (max-width: 992px) {
      .hero-grid { grid-template-columns: 1fr; text-align: center; }
      .hero-actions { justify-content: center; }
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 99px;
      padding: 7px 13px;
      color: var(--cyan);
      font-size: .75rem;
      letter-spacing: .13em;
      background: rgba(5,24,46,.68);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
    }

    h1 {
      font-size: clamp(2.2rem, 4.5vw, 3.8rem);
      line-height: 1.2;
      letter-spacing: -.03em;
      margin: 23px 0 20px;
      font-weight: 800;
    }

    h1 em {
      font-style: normal;
      color: var(--cyan);
      text-shadow: 0 0 28px rgba(85,234,255,.16);
    }

    .lead {
      font-size: 1.1rem;
      color: #c3d6e9;
      margin-bottom: 30px;
    }

    .hero-actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* 圖片視覺與背景發光圓圈區域 */
    .hero-visual {
      position: relative;
      min-height: 480px;
      display: grid;
      place-items: center;
    }

    .orbit {
      position: absolute;
      width: min(100%, 540px); /* 🚨 背景雷達發光圓圈放大 */
      aspect-ratio: 1;
      border: 1px solid rgba(85,234,255,.2);
      border-radius: 50%;
      box-shadow: 0 0 45px rgba(0,145,255,.1), inset 0 0 45px rgba(0,145,255,.08);
    }

    /* 特色與信任列 */
    .trustbar {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #07152a;
      padding: 35px 0;
    }

    .trustgrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
    }

    .trustitem { display: flex; gap: 15px; align-items: center; }
    .trusticon { font-size: 1.8rem; color: var(--cyan); }
    .trusttext h3 { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
    .trusttext p { font-size: 0.85rem; color: var(--muted); }

    /* 頁尾 */
    .footer {
      background: #040c17;
      padding: 40px 0;
      border-top: 1px solid var(--line);
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
