  <!-- ==================== 網頁視覺樣式 (CSS) ==================== -->
  <style>
    :root {
      color-scheme: dark;
      --bg: #050d1b;
      --panel: #0b1c33;
      --line: rgba(117,202,255,.2);
      --cyan: #55eaff;
      --white: #f4f9ff;
      --muted: #a9bdd2;
      --max: 1000px; /* 優化主圖顯示寬度 */
      --line-green: #06C755; 
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: Inter, "Pretendard", "Noto Sans KR", system-ui, -apple-system, sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      width: min(var(--max), calc(100% - 44px));
      margin-inline: auto;
    }

    /* 導航欄 */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(4,12,25,.92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }

    .nav {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .logo {
      font-weight: 950;
      letter-spacing: .15em;
      font-size: 1.08rem;
    }

    .logo span { color: var(--cyan); }

    /* 按鈕樣式 */
    .btn {
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 40px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-weight: 850;
      text-decoration: none;
      font-size: 1.05rem;
      cursor: pointer;
      transition: transform .2s, border-color .2s, box-shadow .2s;
    }

    .btn-line {
      color: #ffffff;
      background: var(--line-green);
      box-shadow: 0 4px 24px rgba(6, 199, 85, 0.3);
    }

    .btn-line:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(6, 199, 85, 0.5);
    }

    /* 主視覺區域：改為置中大圖流 */
    .hero {
      position: relative;
      padding: 40px 0 60px;
      background: linear-gradient(to bottom, #061225, #050d1b);
      text-align: center;
    }

    .hero-image-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      margin: 0 auto 35px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0,0,0,0.6), 0 0 30px rgba(85,234,255,0.1);
      border: 1px solid rgba(117,202,255,0.15);
    }

    .hero-image-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    /* 特色與信任列 */
    .trustbar {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #07152a;
      padding: 35px 0;
    }

    .trustgrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
    }

    .trustitem { display: flex; gap: 15px; align-items: center; }
    .trusticon { font-size: 1.8rem; color: var(--cyan); }
    .trusttext h3 { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
    .trusttext p { font-size: 0.85rem; color: var(--muted); }

    /* 頁尾 */
    .footer {
      background: #040c17;
      padding: 40px 0;
      border-top: 1px solid var(--line);
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
